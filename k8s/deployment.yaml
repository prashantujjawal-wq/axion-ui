
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui
  labels:
    app: axion-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axion-ui
  template:
    metadata:
      labels:
        app: axion-ui
    spec:
      containers:
        - name: axion-ui
          image: axionacr2769710445.azurecr.io/axion-ui:placeholder
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
