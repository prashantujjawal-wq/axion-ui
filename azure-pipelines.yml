# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - release/1.0.0

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'ee7a8c53-2ceb-4a9e-abe0-5bead2c89a2c'
  imageRepository: 'axion-ui'
  containerRegistry: 'axionacr2769710445.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: DeployQA
  displayName: 'Deploy to AKS QA'
  dependsOn: Build
  condition: succeeded()

  jobs:
    - deployment: DeployAxionUI
      displayName: 'Deploy Axion UI to QA'
      environment: 'axion-qa'

      pool:
        vmImage: 'ubuntu-latest'

      strategy:
        runOnce:
          deploy:
            steps:
              - task: AzureCLI@2
                displayName: 'Deploy image to AKS'
                inputs:
                  azureSubscription: 'sc-axion-azure'
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -e

                    az aks get-credentials \
                      --resource-group rg-k8s-lb-lab \
                      --name aks-learning \
                      --overwrite-existing
                    
                    kubectl set image \
                      deployment/axion-ui \
                      axion-ui=axionacr2769710445.azurecr.io/axion-ui:$(Build.BuildId) \
                      -n axion-qa

                    kubectl rollout status \
                      deployment/axion-ui \
                      -n axion-qa \
                      --timeout=180s